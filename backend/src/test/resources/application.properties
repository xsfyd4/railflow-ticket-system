# 自动化测试的 cache 和 stock 逻辑隔离，但共用现有 standalone 测试实例。
ticket.redis.cache.mode=standalone
ticket.redis.cache.host=localhost
ticket.redis.cache.port=6379
ticket.redis.cache.replica-nodes=localhost:6379
ticket.redis.stock.mode=standalone
ticket.redis.stock.host=localhost
ticket.redis.stock.port=6379
ticket.redis.command-timeout-ms=300
ticket.redis.warmup.enabled=false
ticket.redis.reconcile.enabled=false
