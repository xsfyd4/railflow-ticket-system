# ============================================================
#  后端主配置文件
#  改完要重启服务才生效
# ============================================================

server:
  port: 8080                # 后端端口，前端会来调 localhost:8080

spring:
  application:
    name: train-ticket-backend

  # ----------------------------------------------------------
  #  数据库连接（阶段 2 新增）
  #  ★ password 那一行必须改成你自己装 MySQL 时设的密码
  # ----------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/train_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: REMOVED_SECRET
    hikari:
      maximum-pool-size: 20      # 压测确认 10 个连接会形成明显队列，先对照调整为 20
      minimum-idle: 5            # 空闲时保留 5 个
      connection-timeout: 5000   # 5 秒连不上就报错，别一直卡着

  # ----------------------------------------------------------
  #  Redis（Docker 容器：6379）
  # ----------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      client-type: jedis
      timeout: 3s                # 连不上就 3 秒报错，别把接口卡死

  # ----------------------------------------------------------
  #  RabbitMQ（5672 是通信端口，15672 是管理界面）
  # ----------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ------------------------------------------------------------
#  MyBatis 配置
# ------------------------------------------------------------
mybatis:
  # SQL 映射文件（XML）放在哪。
  # classpath 指的就是 target/classes，对应源码里的 src/main/resources。
  # 我们放在 resources/mapper/ 下，所以这里是 mapper/*.xml。
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启驼峰自动映射：数据库的 real_name → Java 的 realName。
    # 不开这个开关，就得为每张表手写一长串 <resultMap>。
    map-underscore-to-camel-case: true

logging:
  config: classpath:logback-spring.xml

# ------------------------------------------------------------
#  JWT 配置（阶段 2 新增）
# ------------------------------------------------------------
ticket:
  cache:
    enabled: true
    # 查票结果缓存时间。库存变化会通过版本号立即失效。
    search-ttl-seconds: 10
  order:
    # 每分钟扫描一次过期待支付订单
    expire-scan-ms: 60000
    # 应用启动后稍等再开始扫描，避免和启动流程抢资源
    expire-initial-delay-ms: 30000
    # 每批最多处理 100 个订单，避免一次任务占用数据库太久
    expire-batch-size: 100
  jwt:
    # 签名密钥。HS256 算法要求至少 32 字节（256 位），太短 jjwt 启动就报错。
    # ★ 真实项目里这个值必须放进环境变量，绝不能提交到 Git——
    #   泄露了别人就能自己签发任意用户的 token。
    secret: train-ticket-dev-secret-key-change-me-2026
    # token 有效期，单位秒。604800 秒 = 7 天
    expire-seconds: 604800
    # 签发者标识，解析时会校验，防止别的系统签的 token 混进来
    issuer: train-ticket

# ------------------------------------------------------------
#  小提醒：密码明文写在配置文件里，本地练习没问题，
#  但真实项目里这个文件是要提交到 Git 的，密码会泄露。
#  届时的做法是拆一个 application-local.yml（已被 .gitignore 忽略）来放密码。
# ------------------------------------------------------------
