# ============================================================
#  后端主配置文件
#  改完要重启服务才生效
# ============================================================

server:
  port: 8080                # 后端端口，前端会来调 localhost:8080

spring:
  application:
    name: train-ticket-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # 本地开发可复制 application-local.yml.example，敏感值不会提交到 Git。
    import: optional:classpath:application-local.yml

  # ----------------------------------------------------------
  #  数据库连接（阶段 2 新增）
  #  密码通过 application-local.yml 或环境变量提供
  # ----------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/train_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20      # 压测确认 10 个连接会形成明显队列，先对照调整为 20
      minimum-idle: 5            # 空闲时保留 5 个
      connection-timeout: 5000   # 5 秒连不上就报错，别一直卡着

  # ----------------------------------------------------------
  #  RabbitMQ（5672 是通信端口，15672 是管理界面）
  # ----------------------------------------------------------
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 每个消费者实例先开 2 个线程，忙时最多 8 个。
        concurrency: 2
        max-concurrency: 8
        prefetch: 20
        # 未捕获异常不能无限塞回原队列，否则会形成毒消息循环。
        default-requeue-rejected: false

# ------------------------------------------------------------
#  MyBatis 配置
# ------------------------------------------------------------
mybatis:
  # SQL 映射文件（XML）放在哪。
  # classpath 指的就是 target/classes，对应源码里的 src/main/resources。
  # 我们放在 resources/mapper/ 下，所以这里是 mapper/*.xml。
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启驼峰自动映射：数据库的 real_name → Java 的 realName。
    # 不开这个开关，就得为每张表手写一长串 <resultMap>。
    map-underscore-to-camel-case: true

logging:
  config: classpath:logback-spring.xml

# ------------------------------------------------------------
#  JWT 配置（阶段 2 新增）
# ------------------------------------------------------------
ticket:
  route-index:
    retry-delay-ms: 30000
  redis:
    # 查票对象和版本号使用独立的 cache 数据组。
    cache:
      mode: ${TICKET_CACHE_REDIS_MODE:standalone}
      host: ${TICKET_CACHE_REDIS_HOST:localhost}
      port: ${TICKET_CACHE_REDIS_PORT:6380}
      master: ${TICKET_CACHE_REDIS_MASTER:cachemaster}
      sentinel-nodes: ${TICKET_CACHE_REDIS_SENTINEL_NODES:localhost:26379}
      replica-nodes:
        - localhost:6381
        - localhost:6382
      password: ${TICKET_CACHE_REDIS_PASSWORD:}
    # 动态库存、UUID 幂等状态和对账使用独立的 stock 数据组。
    stock:
      mode: ${TICKET_STOCK_REDIS_MODE:standalone}
      host: ${TICKET_STOCK_REDIS_HOST:localhost}
      port: ${TICKET_STOCK_REDIS_PORT:6390}
      master: ${TICKET_STOCK_REDIS_MASTER:stockmaster}
      sentinel-nodes: ${TICKET_STOCK_REDIS_SENTINEL_NODES:localhost:26389}
      replica-nodes:
        - localhost:6391
        - localhost:6392
      password: ${TICKET_STOCK_REDIS_PASSWORD:}
    command-timeout-ms: 3000
    idempotency-processing-ttl-seconds: 600
    idempotency-success-ttl-seconds: 604800
    idempotency-failed-ttl-seconds: 86400
    maintenance:
      batch-size: 500
      max-rows-per-run: 5000
    warmup:
      # Docker 运行环境通过环境变量开启，自动化测试默认不启动大范围预热。
      enabled: ${TICKET_REDIS_WARMUP_ENABLED:false}
      initial-delay-ms: 20000
      interval-ms: 3600000
      stock-days: 7
      max-routes: 40
      days: 2
      page-size: 10
    reconcile:
      # 部署时开启；自动化测试默认关闭，避免后台任务与测试数据互相干扰。
      enabled: ${TICKET_REDIS_RECONCILE_ENABLED:false}
      initial-delay-ms: 60000
      interval-ms: 300000
      days: 3
    circuit-breaker:
      failure-threshold: 3
      open-seconds: 15
  cache:
    enabled: true
    # 查票结果缓存时间。库存变化会通过版本号立即失效。
    search-ttl-seconds: 10
    # 实际 TTL 在基础值上下随机浮动，避免同一批 Key 同时过期形成雪崩。
    search-ttl-jitter-percent: 20
    # 有线路但当天无车次/无库存时使用更短的空结果 TTL。
    empty-ttl-seconds: 3
    # 热点缓存失效后只允许一个实例回源并更新缓存。
    rebuild-lock-ttl-ms: 3000
    # 未抢到锁的实例使用指数退避等待缓存回填。
    rebuild-wait-attempts: 5
    rebuild-wait-base-delay-ms: 20
    # Redis 分段数字库存，用于异步下单原子预扣。
    stock-enabled: true
    # 车票日期后至少保留几天的数字库存，便于退票和排障。
    stock-ttl-days-after-travel: 2
  order:
    # 每分钟扫描一次过期待支付订单
    expire-scan-ms: 60000
    # 应用启动后稍等再开始扫描，避免和启动流程抢资源
    expire-initial-delay-ms: 30000
    # 每批最多处理 100 个订单，避免一次任务占用数据库太久
    expire-batch-size: 100
    async:
      # 消费者遇到数据库短暂异常时的总尝试次数。
      max-attempts: 3
      retry-backoff-ms: 100
      # 状态 1 但还没投递成功的请求，由补偿任务重新投递。
      republish-delay-seconds: 30
      # 状态 0/2 卡死超过该时间就终止并释放预扣。
      stale-minutes: 10
      recovery-scan-ms: 30000
      recovery-initial-delay-ms: 30000
      recovery-batch-size: 100
  jwt:
    # 签名密钥。HS256 算法要求至少 32 字节（256 位），太短 jjwt 启动就报错。
    # ★ 真实项目里这个值必须放进环境变量，绝不能提交到 Git——
    #   泄露了别人就能自己签发任意用户的 token。
    secret: ${TICKET_JWT_SECRET:train-ticket-dev-secret-key-change-me-2026}
    # token 有效期，单位秒。604800 秒 = 7 天
    expire-seconds: 604800
    # 签发者标识，解析时会校验，防止别的系统签的 token 混进来
    issuer: train-ticket

# ------------------------------------------------------------
#  本地敏感配置放在 application-local.yml（已被 Git 忽略）。
#  部署时优先通过环境变量注入密码和 JWT 密钥。
# ------------------------------------------------------------
