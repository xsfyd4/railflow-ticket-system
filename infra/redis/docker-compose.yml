name: train-ticket-redis-ha

services:
  cache-master:
    image: redis:7.4
    container_name: cache-master
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6380:6379"
    volumes:
      - cache-master-data:/data
    networks:
      train-ticket-net:
        ipv4_address: 172.18.0.40
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache-replica-1:
    image: redis:7.4
    container_name: cache-replica-1
    command:
      - redis-server
      - --replicaof
      - cache-master
      - "6379"
      - --appendonly
      - "yes"
      - --replica-read-only
      - "yes"
    ports:
      - "6381:6379"
    depends_on:
      cache-master:
        condition: service_healthy
    volumes:
      - cache-replica-1-data:/data
    networks:
      train-ticket-net:
        ipv4_address: 172.18.0.41
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache-replica-2:
    image: redis:7.4
    container_name: cache-replica-2
    command:
      - redis-server
      - --replicaof
      - cache-master
      - "6379"
      - --appendonly
      - "yes"
      - --replica-read-only
      - "yes"
    ports:
      - "6382:6379"
    depends_on:
      cache-master:
        condition: service_healthy
    volumes:
      - cache-replica-2-data:/data
    networks:
      train-ticket-net:
        ipv4_address: 172.18.0.42
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache-sentinel-1:
    image: redis:7.4
    container_name: cache-sentinel-1
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then
          cp /etc/redis-template/sentinel.conf /data/sentinel.conf
        fi
        exec redis-server /data/sentinel.conf --sentinel
    ports:
      - "26379:26379"
    depends_on:
      cache-master:
        condition: service_healthy
      cache-replica-1:
        condition: service_healthy
      cache-replica-2:
        condition: service_healthy
    volumes:
      - ./sentinel/cache-sentinel-1.conf:/etc/redis-template/sentinel.conf:ro
      - cache-sentinel-1-data:/data
    networks:
      train-ticket-net:
        ipv4_address: 172.18.0.43
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -p 26379 sentinel get-master-addr-by-name cachemaster | head -n 1 | grep -Eq '^172\.18\.0\.(40|41|42)$'
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cache-sentinel-2:
    image: redis:7.4
    container_name: cache-sentinel-2
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then
          cp /etc/redis-template/sentinel.conf /data/sentinel.conf
        fi
        exec redis-server /data/sentinel.conf --sentinel
    ports:
      - "26380:26379"
    depends_on:
      cache-master:
        condition: service_healthy
      cache-replica-1:
        condition: service_healthy
      cache-replica-2:
        condition: service_healthy
    volumes:
      - ./sentinel/cache-sentinel-2.conf:/etc/redis-template/sentinel.conf:ro
      - cache-sentinel-2-data:/data
    networks:
      train-ticket-net:
        ipv4_address: 172.18.0.44
